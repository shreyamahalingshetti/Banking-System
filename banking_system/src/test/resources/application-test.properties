spring.application.name=banking-system-test

# H2 in-memory database in PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test JWT and Admin credentials
app.jwt.secret=TestJwtSecretKeyWithAtLeast32CharactersLongForSecurity1234567890
app.admin.email=admin@bank.com
app.admin.password=Admin@12345
